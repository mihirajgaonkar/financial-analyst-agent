[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Production-oriented financial research agent foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-httpx>=0.30.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.3.0", "pytest-httpx>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/financial_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
